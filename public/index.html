<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall Meeting Bot</title><style>body{font:16px system-ui;max-width:820px;margin:3rem auto;padding:0 1rem;color:#15202b}input,button{font:inherit;padding:.7rem}input{width:100%;box-sizing:border-box;margin:.5rem 0}button{background:#1769e0;color:#fff;border:0;border-radius:.4rem;cursor:pointer}section{border:1px solid #d8e0ea;border-radius:.6rem;padding:1rem;margin:1rem 0}small{color:#52616b}pre{white-space:pre-wrap;background:#f5f7fa;padding:.75rem;border-radius:.4rem}</style><body><h1>Recall Meeting Bot</h1><p>Launch a visible Recall bot for a meeting URL, or add <code>[recall]</code> to the title of a future Google Calendar event to schedule it automatically.</p><section><h2>Join a meeting</h2><form id="bot"><label>Meeting URL<input name="meetingUrl" type="url" required placeholder="https://meet.google.com/..." autocomplete="off"></label><label>Join at (optional)<input name="joinAt" type="datetime-local"></label><button>Schedule bot</button></form><p id="result" role="status"></p></section><section><h2>Meeting status and transcripts</h2><div id="dashboard">Loading…</div></section><script>const dashboard=async()=>{const d=await fetch('/api/dashboard').then(r=>r.json());document.querySelector('#dashboard').innerHTML=`<h3>Scheduled meetings</h3><pre>${JSON.stringify(d.intents,null,2)}</pre><h3>Transcripts</h3><pre>${JSON.stringify(d.transcripts,null,2)}</pre>`};document.querySelector('#bot').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),joinAt=f.get('joinAt');const r=await fetch('/api/bots',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({meetingUrl:f.get('meetingUrl'),joinAt:joinAt?new Date(joinAt).toISOString():undefined})});document.querySelector('#result').textContent=r.ok?'Bot scheduled.':'Could not schedule bot.';dashboard()};dashboard();setInterval(dashboard,5000)</script></body></html>
